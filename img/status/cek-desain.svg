    @keyframes pindai { 0%,100% { transform: translate(0,0); } 33% { transform: translate(-46px,-14px); } 66% { transform: translate(-20px,10px); } }
    @keyframes muncul { 0%,15% { opacity: 0; } 35%,100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
