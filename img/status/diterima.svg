<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240">
  <style>
    .lencana { transform-box: fill-box; transform-origin: center; animation: denyut 2s ease-in-out infinite; }
    .pesawat { animation: terbang 3s ease-in-out infinite; }
    .tangan { transform-box: view-box; transform-origin: 258px 128px; animation: lambai 1.6s ease-in-out infinite; }
    @keyframes denyut { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    @keyframes terbang { 0%,100% { transform: translate(0,0); } 50% { transform: translate(6px,-5px); } }
    @keyframes lambai { 0%,100% { transform: rotate(0); } 50% { transform: rotate(12deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <circle cx="160" cy="118" r="104" fill="#e3fbf3"/>
  <ellipse cx="160" cy="218" rx="128" ry="10" fill="#d3eee4"/>
  <!-- pesawat kertas datang -->
  <path d="M30 80q20-30 50-22" stroke="#9fb3d6" stroke-width="2" stroke-dasharray="4 5" fill="none"/>
  <g class="pesawat">
    <path d="M80 50l30 6-26 14z" fill="#1f6fe8"/>
    <path d="M84 70l6-8 20-6z" fill="#1857bd"/>
  </g>
  <!-- papan klip -->
  <rect x="70" y="62" width="112" height="146" rx="12" fill="#fff" stroke="#dbe3f2" stroke-width="2"/>
  <rect x="104" y="52" width="44" height="20" rx="7" fill="#070a1f"/>
  <text x="126" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="14" fill="#070a1f">PRT-0001</text>
  <g stroke-linecap="round">
    <circle cx="90" cy="124" r="7" fill="#1fa971"/>
    <path d="M87 124l2.5 2.5 4-5" stroke="#fff" stroke-width="2" fill="none"/>
    <line x1="104" y1="124" x2="162" y2="124" stroke="#c7cfe0" stroke-width="5"/>
    <circle cx="90" cy="150" r="7" fill="#1fa971"/>
    <path d="M87 150l2.5 2.5 4-5" stroke="#fff" stroke-width="2" fill="none"/>
    <line x1="104" y1="150" x2="150" y2="150" stroke="#c7cfe0" stroke-width="5"/>
    <circle cx="90" cy="176" r="7" fill="none" stroke="#c7cfe0" stroke-width="2"/>
    <line x1="104" y1="176" x2="156" y2="176" stroke="#e3e7f0" stroke-width="5"/>
  </g>
  <!-- lencana centang -->
  <g class="lencana">
    <circle cx="182" cy="66" r="22" fill="#1fa971"/>
    <path d="M172 66l7 7 13-14" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- orang melambai -->
  <rect x="226" y="164" width="11" height="48" rx="5" fill="#070a1f"/>
  <rect x="247" y="164" width="11" height="48" rx="5" fill="#070a1f"/>
  <rect x="221" y="207" width="18" height="8" rx="4" fill="#070a1f"/>
  <rect x="245" y="207" width="18" height="8" rx="4" fill="#070a1f"/>
  <line x1="224" y1="128" x2="214" y2="164" stroke="#f2c39b" stroke-width="10" stroke-linecap="round"/>
  <g class="tangan">
    <line x1="258" y1="128" x2="276" y2="94" stroke="#f2c39b" stroke-width="10" stroke-linecap="round"/>
    <circle cx="277" cy="90" r="7" fill="#f2c39b"/>
  </g>
  <rect x="220" y="112" width="44" height="60" rx="16" fill="#3de0b5"/>
  <rect x="236" y="104" width="12" height="12" rx="4" fill="#e8b48b"/>
  <circle cx="242" cy="92" r="18" fill="#f2c39b"/>
  <path d="M224 94a18 18 0 0 1 36-2c-4-8-12-11-20-10-7 1-13 5-16 12z" fill="#5a3a22"/>
  <circle cx="236" cy="93" r="2" fill="#070a1f"/>
  <circle cx="248" cy="93" r="2" fill="#070a1f"/>
  <path d="M236 99q6 5 12 0" stroke="#070a1f" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
