  <!-- jam pasir -->
  <g class="pasir">
    <rect x="208" y="58" width="56" height="8" rx="4" fill="#b7791f"/>
    <rect x="208" y="150" width="56" height="8" rx="4" fill="#b7791f"/>
    <path d="M216 66h40c0 24-14 30-20 42 6 12 20 18 20 42h-40c0-24 14-30 20-42-6-12-20-18-20-42z" fill="#fff" stroke="#b7791f" stroke-width="4"/>
    <path d="M224 76h24c-2 12-10 18-12 24-2-6-10-12-12-24z" fill="#ff8a3d"/>
    <path d="M222 142h28c-4-12-10-16-14-20-4 4-10 8-14 20z" fill="#ff8a3d"/>
