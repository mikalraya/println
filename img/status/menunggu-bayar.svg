<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240">
  <style>
    .pasir { transform-box: fill-box; transform-origin: center; animation: balik 3s ease-in-out infinite; }
    .koin { animation: naik 2.4s ease-in-out infinite; }
    @keyframes balik { 0%,70% { transform: rotate(0); } 85%,100% { transform: rotate(180deg); } }
    @keyframes naik { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <circle cx="160" cy="118" r="104" fill="#fff4d6"/>
  <ellipse cx="160" cy="218" rx="128" ry="10" fill="#f1e2b8"/>
  <!-- HP berisi QRIS -->
  <rect x="62" y="36" width="104" height="176" rx="16" fill="#070a1f"/>
  <rect x="70" y="50" width="88" height="148" rx="8" fill="#fff"/>
  <rect x="100" y="42" width="28" height="4" rx="2" fill="#2a3150"/>
  <text x="114" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="10" fill="#070a1f">QRIS</text>
  <g fill="#070a1f">
    <rect x="84" y="76" width="18" height="18" rx="2"/><rect x="126" y="76" width="18" height="18" rx="2"/><rect x="84" y="118" width="18" height="18" rx="2"/>
    <rect x="108" y="80" width="6" height="6"/><rect x="116" y="88" width="6" height="6"/><rect x="108" y="100" width="6" height="6"/>
    <rect x="120" y="104" width="6" height="6"/><rect x="132" y="100" width="6" height="6"/><rect x="88" y="104" width="6" height="6"/>
    <rect x="110" y="120" width="6" height="6"/><rect x="124" y="124" width="6" height="6"/><rect x="134" y="118" width="6" height="6"/>
    <rect x="116" y="130" width="6" height="6"/><rect x="138" y="132" width="6" height="6"/>
  </g>
  <g fill="#fff"><rect x="88" y="80" width="10" height="10" rx="1"/><rect x="130" y="80" width="10" height="10" rx="1"/><rect x="88" y="122" width="10" height="10" rx="1"/></g>
  <g fill="#070a1f"><rect x="91" y="83" width="4" height="4"/><rect x="133" y="83" width="4" height="4"/><rect x="91" y="125" width="4" height="4"/></g>
  <rect x="80" y="150" width="68" height="10" rx="5" fill="#e3e7f0"/>
  <rect x="80" y="168" width="68" height="20" rx="10" fill="#1f6fe8"/>
